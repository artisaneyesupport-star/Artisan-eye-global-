version: '3.9'

# =====================================================================
#  ArtisanEye — Docker Compose
#  Runs the full local stack with one command: docker compose up
#
#  Services:
#   - db       : PostgreSQL 15
#   - backend  : Node.js API + the built frontend (public/), both on
#                port 4000 — open http://localhost:4000, that's the
#                whole website, nothing else to run separately.
# =====================================================================

services:

  db:
    image: postgres:15-alpine
    container_name: artisaneye-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       artisaneye
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artisaneye_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d artisaneye"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artisaneye-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV:          production
      PORT:              4000
      DATABASE_URL:      postgresql://postgres:${POSTGRES_PASSWORD:-artisaneye_dev}@db:5432/artisaneye
      JWT_ACCESS_SECRET:  ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN:  15m
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL:       ${FRONTEND_URL:-http://localhost:4000}
      # Cloudinary (optional — photos won't upload without these)
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY:    ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET:  ${CLOUDINARY_API_SECRET:-}
      # Paystack (optional — payments won't work without these)
      PAYSTACK_SECRET_KEY:     ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY:     ${PAYSTACK_PUBLIC_KEY:-}
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET:-}
      PAYSTACK_PLAN_PRO:       ${PAYSTACK_PLAN_PRO:-}
      PAYSTACK_PLAN_TEAM:      ${PAYSTACK_PLAN_TEAM:-}
      PAYMENT_CALLBACK_URL:    ${PAYMENT_CALLBACK_URL:-http://localhost:4000/billing-success.html}
      # Email (auto-uses Ethereal in dev if not set)
      SMTP_HOST:   ${SMTP_HOST:-}
      SMTP_PORT:   ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER:   ${SMTP_USER:-}
      SMTP_PASS:   ${SMTP_PASS:-}
      EMAIL_FROM:     ${EMAIL_FROM:-ArtisanEye <noreply@artisaneye.com>}
      SUPPORT_EMAIL:  ${SUPPORT_EMAIL:-}
      APP_URL:        ${APP_URL:-http://localhost:4000}
    ports:
      - "4000:4000"
    volumes:
      # Persist uploads if Cloudinary not configured
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
